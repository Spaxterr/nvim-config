background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgb(c6d0f5)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 280, 50
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(ca9ee6ff) rgba(8caaeeff) 45deg
    inner_color = rgba(48, 52, 70, 0.6)
    font_color = rgb(c6d0f5)
    check_color = rgb(a6d189)
    fail_color = rgb(e78284)
    placeholder_text = Password
    position = 0, -80
    halign = center
    valign = center
}
