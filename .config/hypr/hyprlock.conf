general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/catppuccin-mocha-leaves.png
    color = rgb(232634)    # shown if the image is missing (e.g. on another machine)
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

# Glass card, same gradient edge as the windows
shape {
    monitor =
    size = 440, 400
    color = rgba(48, 52, 70, 0.45)
    rounding = 24
    border_size = 2
    border_color = rgba(ca9ee6ff) rgba(8caaeeff) 45deg
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = JetBrainsMono Nerd Font ExtraBold
    color = rgb(c6d0f5)
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(ca9ee6)
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgb(a5adce)
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(ca9ee6ff) rgba(8caaeeff) 45deg
    inner_color = rgba(41, 44, 60, 0.7)
    font_color = rgb(c6d0f5)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(a6d189)
    fail_color = rgb(e78284)
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    dots_center = true
    position = 0, -80
    halign = center
    valign = center
}
